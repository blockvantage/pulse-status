owner: blockvantage
repo: pulse-status
customStatusWebsitePackage: '@upptime/status-page@1.17.0'
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

sites:
  - name: Pulse Dashboard
    url: https://pulse.opsprint.ai
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: '<title>Pulse'
  - name: Pulse API Health
    url: https://pulse.opsprint.ai/api/health
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: '"status":"healthy"'
  - name: Pulse API Readiness
    url: https://pulse.opsprint.ai/api/health/ready
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: '"ready":true'
  - name: Pulse Auth
    url: https://pulse.opsprint.ai/login
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: 'brand-kicker'

status-website:
  cname: status.opsprint.ai
  name: Pulse Status
  introTitle: "Pulse Platform Status"
  introMessage: "Real-time monitoring of Pulse platform services. Checks run every 5 minutes."
  customBodyHtml: |
    <aside id="monitor-freshness" class="monitor-freshness" role="alert" aria-live="polite">
      Status checks are delayed. Current service state may be stale.
    </aside>
  css: |
    .monitor-freshness {
      background: #fff4e5;
      border-bottom: 1px solid #d97706;
      color: #6f3b00;
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      text-align: center;
    }
    .monitor-freshness[hidden] {
      display: none;
    }
  scripts:
    - src: /status-freshness.js?v=1
      async: true
  navbar:
    - title: Status
      href: /
    - title: Pulse
      href: https://pulse.opsprint.ai
    - title: Contact
      href: https://pulse.opsprint.ai/contact

workflowSchedule:
  uptime: "*/5 * * * *"
