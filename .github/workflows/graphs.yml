# Pulse status workflow based on Upptime 1.43.12.
# Dependency updates require reviewed, SHA-pinned commits.

name: Graphs CI
on:
  schedule:
    - cron: "17 0 * * *"
  repository_dispatch:
    types: [graphs]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.repository }}-upptime-writer
  cancel-in-progress: false
jobs:
  release:
    name: Generate graphs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ github.token }}
      - name: Setup Node.js for graphs
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
      - name: Generate graphs
        uses: upptime/uptime-monitor@6e7c186f842ae4040cf75956a00548426a1e42aa # v1.43.12
        with:
          command: "graphs"
        env:
          GH_PAT: ${{ github.token }}
