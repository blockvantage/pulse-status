# Pulse status workflow based on Upptime 1.43.12.
# Dependency updates require reviewed, SHA-pinned commits.

name: Summary CI
on:
  schedule:
    - cron: "37 0 * * *"
  repository_dispatch:
    types: [summary]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: ${{ github.repository }}-${{ github.ref_name }}-summary
  cancel-in-progress: false
jobs:
  release:
    name: Generate README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Update summary in README
        uses: upptime/uptime-monitor@6e7c186f842ae4040cf75956a00548426a1e42aa # v1.43.12
        with:
          command: "readme"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
