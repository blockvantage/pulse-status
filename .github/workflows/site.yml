# Pulse status workflow based on Upptime 1.43.12.
# Dependency updates require reviewed, SHA-pinned commits.

name: Static Site CI
on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
  schedule:
    - cron: "13 1 * * *"
  repository_dispatch:
    types: [static_site]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.repository }}-upptime-writer
  cancel-in-progress: false
jobs:
  release:
    name: Build and deploy site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          token: ${{ github.token }}
          persist-credentials: false
      - name: Check out pinned status generator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: upptime/status-page
          ref: 54c2ff5a3d998d525ee4c7e68dc7ce7414d89c33 # v1.17.0
          path: site
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked status generator
        working-directory: site
        run: npm ci
      - name: Generate site
        working-directory: site
        run: |
          mkdir -p assets
          cp -R ../assets/. assets/
          npm run export
      - name: Preserve valid monitor freshness
        working-directory: site
        env:
          FRESHNESS_SOURCE_URL: https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/monitor-freshness.json
        run: >-
          bash ../scripts/preserve-monitor-freshness.sh
          "$FRESHNESS_SOURCE_URL"
          "__sapper__/export/monitor-freshness.json"
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        name: GitHub Pages Deploy
        with:
          github_token: ${{ github.token }}
          publish_dir: "site/__sapper__/export/"
          force_orphan: "false"
          user_name: "Upptime Bot"
          user_email: "73812536+upptime-bot@users.noreply.github.com"
